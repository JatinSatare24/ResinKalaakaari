[functions.send-order-email]
enabled = true
# false on purpose. The caller is our own database (pg_net), which sends a
# shared secret in the x-webhook-secret header instead of a Supabase JWT.
# handler.ts checks that secret against Vault through verify_order_email_secret(),
# so a request without it gets 401 before any work happens.
verify_jwt = false
entrypoint = "./functions/send-order-email/index.ts"
